services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hotel_django_web
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=hotel.settings
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=hotel_db
      - DB_USER=hotel_user
      - DB_PASSWORD=hotel_password
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: mysql:8.0
    container_name: hotel_mysql_db
    restart: always
    environment:
      - MYSQL_DATABASE=hotel_db
      - MYSQL_USER=hotel_user
      - MYSQL_PASSWORD=hotel_password
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
