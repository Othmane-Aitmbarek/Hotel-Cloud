apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-django
  labels:
    app: hotel-django
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-django
  template:
    metadata:
      labels:
        app: hotel-django
    spec:
      containers:
      - name: hotel-django
        image: hotel-django:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: hotel_db
        - name: DB_USER
          value: hotel_user
        - name: DB_PASSWORD
          value: hotel_password
        - name: ALLOWED_HOSTS
          value: "*"
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-django-service
  labels:
    app: hotel-django
spec:
  type: NodePort
  selector:
    app: hotel-django
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
